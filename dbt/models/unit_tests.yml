- name: category_excludes_unknown_labels_from_rate
  description: NULL не считается легитимной операцией; 1/(1+1), не 1/3; нулевой знаменатель = NULL.
  model: mart_fraud_by_category
  given:
  - input: ref('stg_transactions')
    rows:
    - category: travel
      amount: 100
      is_fraud: 1
      is_labeled: 1
    - category: travel
      amount: 50
      is_fraud: 0
      is_labeled: 1
    - category: travel
      amount: 25
      is_fraud: null
      is_labeled: 0
    - category: home
      amount: 10
      is_fraud: null
      is_labeled: 0
  expect:
    rows:
    - category: travel
      transaction_count: 3
      labeled_transaction_count: 2
      fraud_count: 1
      fraud_rate: 50
      total_amount: 175
      fraud_amount: 100
    - category: home
      transaction_count: 1
      labeled_transaction_count: 0
      fraud_count: 0
      fraud_rate: null
      total_amount: 10
      fraud_amount: 0
- name: daily_metrics_exact_p95_and_large_share
  description: Группировка по дате, точный P95; LARGE считается по границе включительно.
  model: mart_daily_state_metrics
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_date: '2019-01-01'
      us_state: CA
      amount: 10
      amount_bucket: SMALL
    - transaction_date: '2019-01-01'
      us_state: CA
      amount: 100
      amount_bucket: MEDIUM
    - transaction_date: '2019-01-01'
      us_state: CA
      amount: 1000
      amount_bucket: LARGE
    - transaction_date: '2019-01-02'
      us_state: CA
      amount: 20
      amount_bucket: SMALL
  expect:
    rows:
    - transaction_date: '2019-01-01'
      us_state: CA
      transaction_count: 3
      total_amount: 1110
      avg_amount: 370
      p95_amount: 1000
      large_transaction_count: 1
      large_transaction_share: 33.333333333333336
    - transaction_date: '2019-01-02'
      us_state: CA
      transaction_count: 1
      total_amount: 20
      avg_amount: 20
      p95_amount: 20
      large_transaction_count: 0
      large_transaction_share: 0
- name: customer_risk_thresholds_and_unknown
  description: Точные границы HIGH=5%, MEDIUM=1%; ниже 1% LOW; NULL риск отдельно помечен.
  model: mart_customer_risk_profile
  given:
  - input: ref('stg_transactions')
    format: sql
    fixture: customer_risk_input
  expect:
    rows:
    - customer_id: high
      fraud_rate: 5
      risk_level: HIGH
      has_known_risk: 1
    - customer_id: medium
      fraud_rate: 1
      risk_level: MEDIUM
      has_known_risk: 1
    - customer_id: low
      fraud_rate: 0.5
      risk_level: LOW
      has_known_risk: 1
    - customer_id: unknown
      fraud_rate: null
      risk_level: LOW
      has_known_risk: 0
- name: state_counts_distinct_customers_and_merchants
  description: DC не теряется; повторные клиенты и мерчанты считаются один раз.
  model: mart_fraud_by_state
  given:
  - input: ref('stg_transactions')
    rows:
    - us_state: DC
      customer_id: a
      merchant: shop
      amount: 10
      is_fraud: 1
      is_labeled: 1
    - us_state: DC
      customer_id: a
      merchant: shop
      amount: 20
      is_fraud: 0
      is_labeled: 1
    - us_state: DC
      customer_id: b
      merchant: cafe
      amount: 30
      is_fraud: null
      is_labeled: 0
  expect:
    rows:
    - us_state: DC
      transaction_count: 3
      unique_customers: 2
      unique_merchants: 2
      total_amount: 60
      fraud_amount: 10
      fraud_rate: 50
